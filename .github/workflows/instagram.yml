name: Refresh Instagram gallery
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh-instagram.js'
      - '.github/workflows/instagram.yml'
permissions:
  contents: write
concurrency:
  group: instagram-gallery-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node scripts/refresh-instagram.js
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish only changed gallery data
        run: |
          git add public/instagram/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh public Instagram gallery'
          git pull --rebase origin main
          git push origin HEAD:main
